name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install 'pytest>=8,<9'
      - name: Run offline regression suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Check script and diff
        run: |
          python plugins/ihav-competitor-search/core/ihav-competitor-search/scripts/competitors.py --help
          git diff --check
