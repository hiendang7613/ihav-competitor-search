[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ihav-competitor-search"
version = "0.2.0"
description = "Offline competitor table synthesis with traffic and cell evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hiendang7613"}]
dependencies = []

[project.scripts]
ihav-competitor-search = "ihav_competitor_search.cli:main"

[tool.setuptools]
package-dir = {"" = "plugins/ihav-competitor-search/core/ihav-competitor-search"}

[tool.setuptools.packages.find]
where = ["plugins/ihav-competitor-search/core/ihav-competitor-search"]
include = ["ihav_competitor_search*"]

[tool.pytest.ini_options]
pythonpath = ["plugins/ihav-competitor-search/core/ihav-competitor-search"]
testpaths = ["tests"]
